<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="pharmGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pharmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cross Icon container -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Rounded Cross -->
    <rect x="22" y="2" width="16" height="56" rx="8" fill="url(#pharmGreen)"/>
    <rect x="2" y="22" width="56" height="16" rx="8" fill="url(#pharmGreen)"/>
    
    <!-- Inner Caduceus / Snake motif -->
    <circle cx="30" cy="30" r="7" fill="#ffffff" opacity="0.95"/>
    <path d="M 30 18 Q 36 24 30 30 T 30 42" stroke="url(#pharmGreen)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="18" r="2" fill="#047857"/>
    
    <!-- Subtle medical dot -->
    <circle cx="48" cy="12" r="3" fill="url(#pharmBlue)"/>
  </g>

  <!-- Text Brand -->
  <text x="82" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    PHARMACIE <tspan fill="#059669">SABALI</tspan>
  </text>
  <text x="83" y="56" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="2">
    VOTRE SANTÉ, NOTRE PRIORITÉ
  </text>
</svg>
