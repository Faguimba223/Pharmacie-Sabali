<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Decorative background circles -->
  <circle cx="360" cy="40" r="80" fill="#ffffff" opacity="0.06"/>
  <circle cx="40" cy="260" r="60" fill="#ffffff" opacity="0.06"/>
  
  <!-- Product / Concept Container Card -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="320" height="240" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Icon Circle -->
    <circle cx="160" cy="85" r="50" fill="#0284c7" opacity="0.12"/>
    <circle cx="160" cy="85" r="38" fill="#0284c7" opacity="0.2"/>
    
    <!-- Central Icon -->
    <g transform="translate(136, 61)" color="#0284c7">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
    </g>

    <!-- Badge -->
    <rect x="110" y="150" width="100" height="24" rx="12" fill="#0284c7" opacity="0.15"/>
    <text x="160" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle" letter-spacing="1">PARAPHARMACIE</text>

    <!-- Title -->
    <text x="160" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Eau Thermale Apaisante</text>
    
    <!-- Quality Seal / Safe badge -->
    <g transform="translate(160, 222)">
      <circle cx="-50" cy="0" r="3" fill="#10b981"/>
      <text x="-40" y="3.5" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Pharmacie Sabali • Certifié conforme</text>
    </g>
  </g>
</svg>